[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scoped-agent"
version = "0.1.0"
description = "Least-privilege and auditable receipts for AI agent tool calls"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Scoped contributors"}]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
dev = ["pytest>=8"]

[project.scripts]
scoped = "scoped.cli:main"

[tool.setuptools.packages.find]
include = ["scoped*"]
